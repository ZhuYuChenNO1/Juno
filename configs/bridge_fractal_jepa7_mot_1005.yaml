# Juno / JEPA7-MoT Bridge + Fractal policy recipe.
# Runtime paths are supplied by scripts/run_bridge_fractal_jepa7_mot_train.sh.
run_id: juno-policy_bridge_fractal_jepa7_mot
run_root_dir: ./runs
seed: 42
wandb_entity: null
wandb_project: juno
is_debug: false
version_id: "0.21"

framework:
  name: juno-policy
  qwenvl:
    base_vlm: ""
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  jepa:
    ckpt_path: ""
    ckpt_source: lewm
    # The 1005 working-tree experiment uses the ViT-Base frozen-CLS target.
    encoder_scale: base
    image_size: 224
    patch_size: 14
    embed_dim: 192
    projector_hidden_dim: 2048
    num_reasoning_queries: 8
    cross_attn_heads: 8
    cross_attn_dropout: 0.0
    num_future_frames: 8
    frame_stride: 2
    loss_type: cosine_smoothl1
    smoothl1_weight: 0.1
    align_loss_weight_max: 0.2
    align_loss_warmup_steps: 5000
    align_loss_plateau_steps: 30000
    align_loss_decay_steps: 70000
    align_loss_min: 0.05
    use_input_fusion: true
    input_fusion_gate_init: 0.0
    input_xattn_scale: 0.5
    input_xattn_heads: 8
    input_xattn_dropout: 0.0
    use_fm_jepa_prefix: false
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 16
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

datasets:
  # The current launcher trains the VLA stream. These VLM fields are retained
  # for schema compatibility with Juno and are not used by this entry point.
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 1
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: ""
    data_mix: bridge_rt_1_jepa
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    future_video_horizon: 8
    frame_stride: 2
    per_device_batch_size: 16
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    num_workers: 4

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    mot_reasoning_layers: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: null
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: ''
  reload_modules: ''
  pretrained_strict: false
  pretrained_skip_mismatch: true
  save_format: pt
  save_final_checkpoint: true
  is_resume: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
