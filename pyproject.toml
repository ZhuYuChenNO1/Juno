[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juno-vla"
version = "0.1.0"
description = "Juno predictive-latent vision-language-action policy"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["juno*", "deployment*"]
